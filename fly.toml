# Staging (ENV=staging): private, reachable only through Flycast; see docs/deploy.md.
app = "hair-chat-api-stg"
primary_region = "fra"

[build]
  # Dockerfile in the repo root; uvicorn listens on 0.0.0.0:8000, as Flycast requires.

[deploy]
  # Runs in a temporary machine with the app's secrets; a failure aborts the deploy.
  release_command = "alembic upgrade head"

[env]
  ENV = "staging"
  KB_INCLUDE_DRAFTS = "true"
  LLM_CHAIN = "gemini:gemini-3.5-flash-lite,groq:openai/gpt-oss-120b"
  LLM_FIRST_TOKEN_TIMEOUT_S = "8"

[http_service]
  internal_port = 8000
  # Flycast is plain HTTP inside the private network: force_https would break it.
  force_https = false
  # "stop", not "suspend": a resumed snapshot keeps dead DB sockets in the pool (app/db/session.py).
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
