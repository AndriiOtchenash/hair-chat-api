# Moderation eval set (ADR 0004): our own phrases only, never real user messages.
# Run against the real API: uv run python -m scripts.moderation_eval  (not in CI)
# expected = what app.services.moderation_policy should decide:
#   allow - normal hair-care talk, incl. injuries, despair about hair, hyperbole
#   soft  - real crisis signal: answered with care + safety_notice (help lines)
#   block - explicit threat to another person / abuse: 422 message_blocked
# group is for reading the report only.

